<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Detalhes do Orçamento</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div style="padding: 20px">
    <h2>Confira os dados da sua reserva</h2>

    <ion-item>
      <ion-label>
        <h2>Valor da diária</h2>
        <p>R$ {{diaria}}</p>
      </ion-label>
    </ion-item>

    <ion-item>
      <ion-label>
        <h2>Quantidade de dias</h2>
        <p>{{dias}} dias</p>
      </ion-label>
    </ion-item>

    <ion-item>
      <ion-label>
        <h2>Total a pagar</h2>
        <p>R$ {{total}}</p>
      </ion-label>
    </ion-item>

    <ion-button expand="block" color="medium" (click)="voltar()">VOLTAR</ion-button>
    <ion-button expand="block" (click)="confirmar()">CONFIRMAR</ion-button>
  </div>

</ion-content>
